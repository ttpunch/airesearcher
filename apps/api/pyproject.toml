[project]
name = "airesearcher-api"
version = "0.1.0"
description = "airesearcher FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "boto3>=1.35",
    "httpx>=0.28",
    "pymupdf>=1.24",
    "python-multipart>=0.0.12",
    "pgvector>=0.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "httpx>=0.28",
    "pytest-asyncio>=1.4.0",
    "moto[server]>=5.2.3",
    "asgi-lifespan>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# app.core.db's engine/pool is a module-level singleton (correct for the
# running app, which has exactly one event loop). Function-scoped test
# loops (pytest-asyncio's default) would hand that pool a connection tied
# to one test's loop, then try to use/close it from a different loop in
# the next test. Session-scoped loop avoids that entirely.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` in argument defaults is the documented,
# idiomatic dependency-injection pattern, not the mutable-default footgun
# this rule exists to catch.
ignore = ["B008"]
