[project]
name = "airesearcher-api"
version = "0.1.0"
description = "airesearcher FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff.lint]
# B008: FastAPI's `Depends(...)` in argument defaults is the documented,
# idiomatic dependency-injection pattern, not the mutable-default footgun
# this rule exists to catch.
ignore = ["B008"]
