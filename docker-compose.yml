services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airesearcher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airesearcher}
      POSTGRES_DB: ${POSTGRES_DB:-airesearcher}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airesearcher} -d ${POSTGRES_DB:-airesearcher}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-airesearcher}:${POSTGRES_PASSWORD:-airesearcher}@postgres:5432/${POSTGRES_DB:-airesearcher}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./apps/api:/app
      - api_venv:/app/.venv

volumes:
  postgres_data:
  api_venv:
